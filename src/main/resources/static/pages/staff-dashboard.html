<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="/css/Styling.css">

    <script defer src="/js/staff.js"></script>

</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2 class="logo">
            STAFF PANEL
        </h2>

        <nav class="nav-links">

            <a href="javascript:void(0)"
               onclick="showSection('profile-section')">
                My Profile
            </a>

            <a href="javascript:void(0)"
               onclick="showSection('payment-section')">
                Payments
            </a>

            <a href="javascript:void(0)"
               onclick="showSection('queries-section')">
                Queries
            </a>

        </nav>

        <button
                class="logout-btn"
                onclick="logout()">

            Logout

        </button>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <h1>
            Staff Dashboard
        </h1>

        <!-- PROFILE -->

        <section
                class="card dashboard-section"
                id="profile-section">

            <h2>
                My Profile
            </h2>

            <div id="profile">

                Loading profile...

            </div>

        </section>

        <!-- PAYMENTS -->

        <section
                class="card dashboard-section"
                id="payment-section"
                style="display:none;">

            <h2>
                Upload Proof of Payment
            </h2>

            <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount"
                    step="0.01"
                    min="1">

            <div class="form-group">

                <input
                        type="file"
                        id="proofFile"
                        accept=".jpg,.jpeg,.png,.pdf">

            </div>

            <button
                    class="primary-btn"
                    onclick="uploadPayment()">

                Upload Proof

            </button>

            <hr>

            <h2>
                Payment History
            </h2>

            <div class="table-container">

                <table id="paymentTable">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Month</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>File</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr>
                        <td colspan="6">
                            Loading payments...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <!-- QUERIES -->

        <section
                class="card dashboard-section"
                id="queries-section"
                style="display:none;">

            <h2>
                Member Queries
            </h2>

            <input
                    type="text"
                    id="search"
                    placeholder="Search queries..."
                    oninput="searchQueries()">

            <div class="table-container">

                <table id="queryTable">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Message</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr>
                        <td colspan="6">
                            Loading queries...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <button onclick="loadQueries()">

                Refresh Queries

            </button>

        </section>

    </main>

</div>

</body>

</html>
