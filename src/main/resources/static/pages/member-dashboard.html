<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=0.5"
    >
    <style>
        .dashboard-section {
            display: none;
        }

        #profile-section {
            display: block;
        }
    </style>

    <title>Member Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/Styling.css">

    <!-- JS -->
    <script defer src="/js/member.js?v=1"></script>

</head>

<body>

<div class="dashboard-container">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div>

            <h2 class="logo">
                Nomhala Society
            </h2>

            <nav class="nav-links">

                <a href="javascript:void(0)" onclick="showSection('profile-section')">
                    Dashboard
                </a>

                <a href="javascript:void(0)" onclick="showSection('query-section')">
                    My Queries
                </a>

                <a href="javascript:void(0)" onclick="showSection('payment-section')">
                    Payments
                </a>

            </nav>

        </div>

        <button
                class="logout-btn"
                onclick="logout()"
        >
            Logout
        </button>

    </aside>

    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <h1>
            Member Dashboard
        </h1>

        <!-- ================= PROFILE ================= -->

        <section class="card dashboard-section" id="profile-section" style="display:none;">

            <h2>Profile</h2>

            <div id="profile">Loading...</div>

        </section>

        <!-- ================= PAYMENT ================= -->

        <section
                class="card"
                id="payment-section"
        >

            <h2>
                Upload Proof of Payment
            </h2>
            <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount"
                    step="0.01"
                    min="1"
                    required
            />
            <div class="form-group">

                <input
                        type="file"
                        id="proofFile"
                        accept=".jpg,.jpeg,.png,.pdf"
                >

            </div>

            <button
                    class="primary-btn"
                    onclick="uploadPayment()"
            >
                Upload Proof
            </button>

        </section>

        <!-- ================= PAYMENT HISTORY ================= -->

        <section class="card">

            <h2>
                Payment History
            </h2>

            <div class="table-container">

                <table id="paymentTable">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Month</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>File</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <td colspan="6">
                            Loading payments...
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

        <!-- ================= QUERY FORM ================= -->

        <section
                class="card"
                id="query-section"
        >

            <h2>
                Send Query
            </h2>

            <div class="form-group">

                <input
                        id="subject"
                        type="text"
                        placeholder="Subject"
                >

            </div>

            <div class="form-group">

                <textarea
                        id="message"
                        placeholder="Write your message..."
                ></textarea>

            </div>

            <button
                    class="primary-btn"
                    onclick="sendQuery()"
            >
                Send Query
            </button>

        </section>

        <!-- ================= QUERY TABLE ================= -->

        <section class="card">

            <h2>
                My Queries
            </h2>

            <div class="table-container">

                <table id="myTable">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Subject</th>
                        <th>Message</th>
                        <th>Status</th>
                        <th>Response</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <td colspan="5">
                            Loading queries...
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>
</html>
