version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: mysociety-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mysociety
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    container_name: mysociety-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql